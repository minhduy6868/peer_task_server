apiVersion: v1
kind: Service
metadata:
  name: peertask-api
  namespace: peertask
  labels:
    app.kubernetes.io/name: peertask-api
spec:
  type: ClusterIP
  # Signaling rooms are in-memory — keep one replica and sticky sessions.
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: peertask-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peertask-api
  namespace: peertask
  labels:
    app.kubernetes.io/name: peertask-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: peertask-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peertask-api
    spec:
      containers:
        - name: api
          image: ghcr.io/minhduy6868/peer_task_server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: peertask-api
            - secretRef:
                name: peertask-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
