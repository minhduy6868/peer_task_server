# Local cluster only. Production secret points at RDS and has no POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: peertask-api
  namespace: peertask
type: Opaque
stringData:
  DATABASE_URL: postgresql://peertask:CHANGE_ME@postgres:5432/peertask
  JWT_SECRET: replace-with-32-plus-random-chars
  POSTGRES_PASSWORD: CHANGE_ME
  ADMIN_SECRET: ""
