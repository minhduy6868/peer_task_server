# Do not commit. Token comes from a remotely managed Cloudflare Tunnel.
# Public hostname: api.peertask.24now.space
# Service URL:     http://peertask-api.peertask.svc.cluster.local:3000
#
#   kubectl -n peertask create secret generic peertask-tunnel \
#     --from-literal=TUNNEL_TOKEN='paste-the-tunnel-token'
apiVersion: v1
kind: Secret
metadata:
  name: peertask-tunnel
  namespace: peertask
type: Opaque
stringData:
  TUNNEL_TOKEN: paste-the-tunnel-token
