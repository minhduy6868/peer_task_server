apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: peertask
  labels:
    app.kubernetes.io/name: peertask-postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
  selector:
    app.kubernetes.io/name: peertask-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: peertask
  labels:
    app.kubernetes.io/name: peertask-postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peertask-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peertask-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: peertask
            - name: POSTGRES_DB
              value: peertask
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peertask-api
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "peertask", "-d", "peertask"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
