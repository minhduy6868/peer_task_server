# Do not commit. Create on the cluster:
#   kubectl -n peertask create secret generic peertask-api \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/peertask?sslmode=require' \
#     --from-literal=JWT_SECRET='same-secret-as-the-current-api' \
#     --from-literal=ADMIN_SECRET=''
apiVersion: v1
kind: Secret
metadata:
  name: peertask-api
  namespace: peertask
type: Opaque
stringData:
  DATABASE_URL: postgresql://peertask:CHANGE_ME@your-db.ap-southeast-1.rds.amazonaws.com:5432/peertask?sslmode=require
  JWT_SECRET: replace-with-32-plus-random-chars
  ADMIN_SECRET: ""
