# Copy to secret.yaml (do not commit) or create with:
#   kubectl -n peertask create secret generic peertask-api \
#     --from-literal=DATABASE_URL='postgresql://peertask:CHANGE_ME@postgres:5432/peertask' \
#     --from-literal=JWT_SECRET='replace-with-32-plus-random-chars' \
#     --from-literal=ADMIN_SECRET='optional-admin-header-secret'
apiVersion: v1
kind: Secret
metadata:
  name: peertask-api
  namespace: peertask
type: Opaque
stringData:
  DATABASE_URL: postgresql://peertask:CHANGE_ME@postgres:5432/peertask
  JWT_SECRET: replace-with-32-plus-random-chars
  POSTGRES_PASSWORD: CHANGE_ME
  ADMIN_SECRET: ""
