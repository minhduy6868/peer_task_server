services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peertask
      POSTGRES_PASSWORD: peertask
      POSTGRES_DB: peertask
    volumes:
      - peertask_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertask -d peertask"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    image: peertask-server:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://peertask:peertask@db:5432/peertask
      JWT_SECRET: change-me-in-production-use-at-least-32-chars
      OLLAMA_URL: ${OLLAMA_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  peertask_pg:
