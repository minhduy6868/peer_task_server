name: cd

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default latest on main, dev on dev)
        required: false
      deploy:
        description: Apply k8s manifests after push
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: minhduy6868/peer_task_server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "Set repository secret KUBE_CONFIG (base64 kubeconfig) to deploy."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
              TAG=dev
            else
              TAG=latest
            fi
          fi
          kubectl apply -f k8s/namespace.yaml
          kubectl -n peertask apply -f k8s/configmap.yaml
          kubectl apply -k k8s
          kubectl -n peertask set image deployment/peertask-api api=ghcr.io/${{ env.IMAGE_NAME }}:${TAG}
          kubectl -n peertask rollout status deployment/peertask-api --timeout=180s
